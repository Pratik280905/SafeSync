<svg width="800" height="1120" viewBox="0 0 800 1120" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="1120" rx="16" fill="#FFFFFF"/>

  <!-- ================= CONNECTORS ================= -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- Incident Input -> Data Extraction -->
    <path d="M400,92 L400,128" marker-end="url(#arrow)"/>
    <!-- Data Extraction -> split -->
    <path d="M400,200 L400,220 L180,220 L180,238" marker-end="url(#arrow)"/>
    <path d="M400,200 L400,220 L620,220 L620,238" marker-end="url(#arrow)"/>
    <!-- Incident Memory -> Pattern Detection -->
    <path d="M180,310 L180,378" marker-end="url(#arrow)"/>
    <!-- Pattern Detection -> Agent 1 (left) -->
    <path d="M180,450 L180,480 L372,480 L372,508" marker-end="url(#arrow)"/>
    <!-- Regulatory KB -> Agent 1 (right) -->
    <path d="M620,310 L620,480 L428,480 L428,508" marker-end="url(#arrow)"/>
    <!-- Agent 1 -> Agent 2 -->
    <path d="M400,580 L400,608" marker-end="url(#arrow)"/>
    <!-- Agent 2 -> Human Gate -->
    <path d="M400,680 L400,708" marker-end="url(#arrow)"/>
    <!-- Human Gate -> split Approved / Rejected -->
    <path d="M400,780 L400,800 L250,800 L250,828" marker-end="url(#arrow)"/>
    <path d="M400,780 L400,800 L550,800 L550,828" marker-end="url(#arrow)"/>
    <!-- Approved -> Mock Filing API -->
    <path d="M250,888 L250,928" marker-end="url(#arrow)"/>
    <!-- Mock Filing API -> Database -->
    <path d="M250,988 L250,1018" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= NODES ================= -->

  <!-- Incident Input -->
  <rect x="270" y="32" width="260" height="60" rx="14" fill="#0891B2"/>
  <text x="400" y="58" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Incident Input</text>
  <text x="400" y="78" text-anchor="middle" fill="#E0F2FE" font-size="12">Webhook / API source</text>

  <!-- Data Extraction -->
  <rect x="260" y="130" width="280" height="70" rx="14" fill="#334155"/>
  <text x="400" y="160" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Data Extraction</text>
  <text x="400" y="180" text-anchor="middle" fill="#CBD5E1" font-size="12">Free text → structured JSON</text>

  <!-- Incident Memory -->
  <rect x="60" y="240" width="240" height="70" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="180" y="270" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">Incident Memory</text>
  <text x="180" y="290" text-anchor="middle" fill="#0F766E" font-size="12">Vector similarity search</text>

  <!-- Regulatory KB -->
  <rect x="500" y="240" width="240" height="70" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="620" y="266" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">Regulatory</text>
  <text x="620" y="284" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">Knowledge Base</text>

  <!-- Pattern Detection -->
  <rect x="60" y="380" width="240" height="70" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="180" y="408" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">Cross-Site Pattern</text>
  <text x="180" y="426" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">Detection</text>

  <!-- Agent 1 -->
  <rect x="280" y="510" width="240" height="70" rx="14" fill="#4F46E5"/>
  <text x="400" y="540" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Agent 1</text>
  <text x="400" y="560" text-anchor="middle" fill="#E0E7FF" font-size="12">Compliance Analyst</text>

  <!-- Agent 2 -->
  <rect x="280" y="610" width="240" height="70" rx="14" fill="#4F46E5"/>
  <text x="400" y="640" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Agent 2</text>
  <text x="400" y="660" text-anchor="middle" fill="#E0E7FF" font-size="12">Compliance Verifier</text>

  <!-- Human Gate -->
  <rect x="280" y="710" width="240" height="70" rx="14" fill="#F97316"/>
  <text x="400" y="740" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Human Gate</text>
  <text x="400" y="760" text-anchor="middle" fill="#FFEDD5" font-size="12">Approve / Reject</text>

  <!-- Approved -->
  <rect x="140" y="830" width="220" height="58" rx="14" fill="#16A34A"/>
  <text x="250" y="865" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Approved</text>

  <!-- Rejected -->
  <rect x="440" y="830" width="220" height="58" rx="14" fill="#DC2626"/>
  <text x="550" y="860" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Rejected</text>
  <text x="550" y="877" text-anchor="middle" fill="#FEE2E2" font-size="11">Filing blocked</text>

  <!-- Mock Filing API -->
  <rect x="130" y="930" width="240" height="60" rx="14" fill="#334155"/>
  <text x="250" y="965" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Mock Filing API</text>

  <!-- Database -->
  <rect x="130" y="1020" width="240" height="60" rx="14" fill="#0F172A"/>
  <text x="250" y="1055" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Incident Database</text>
</svg>
